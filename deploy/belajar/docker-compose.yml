# Belajar Al-Qur'an module — its OWN compose project.
#
# `name: dakwah-belajar` is load-bearing: the main stack (project
# `dakwah-lens`) deploys with `up -d --remove-orphans`, which would delete any
# container it considers part of ITS project. A separate project name keeps
# the two deploys from ever touching each other's containers.
#
# The image is built in CI and `docker load`-ed by deploy/belajar/deploy.sh;
# nothing is built on the VM.
name: dakwah-belajar

services:
  belajar-web:
    image: dakwah-belajar-web:latest
    restart: unless-stopped
    # Created once by deploy.sh (mode 600): DATABASE_URL for the module's own
    # `dakwah_belajar` database. (MAIN_APP_INTERNAL_URL, written there by older
    # installs for sign-in, is no longer read: the module has no sign-in, 2026-10-12.)
    # Optional, added by hand: BELAJAR_WARIS=on shows the Ilmu Waris track,
    # hidden while the line is absent (operator, 2026-10-10;
    # belajar/src/lib/features.ts); BELAJAR_SURAHS=al-fatihah,al-ikhlas,…
    # lists the surahs of the Qur'an track to show, Al-Fatihah only while the
    # line is absent (operator, 2026-10-10: the others "segera hadir");
    # BELAJAR_UNLISTED=al-ikhlas,… lists surahs that answer at their address
    # but are linked from nowhere (default al-ikhlas while the line is absent,
    # empty = none; operator, 2026-10-20). Search engines (docs/belajar-plan.md
    # L42, 2026-11-26): the module is PUBLIC by the image's own default
    # (BELAJAR_PUBLIC=true, set in the Dockerfile), so nothing is needed here
    # for Google to see it; the English pages, Ilmu Waris, an unlisted or
    # unpublished surah, the share cards, the Kosakata search and the word
    # pages carry noindex and are not in /belajar/sitemap.xml. Two optional
    # lines: BELAJAR_PUBLIC=false is a kill switch (noindex on every response,
    # an empty sitemap, no rebuild); BELAJAR_KOSAKATA_WORDS_INDEXED=on takes
    # the 4,832 word pages (/kosakata/kata/{rank}) into the index. The
    # file is read when the container is created: after editing it,
    # `up -d --force-recreate` (a restart keeps the old values).
    env_file: /srv/dakwah-lens/belajar.env
    environment:
      TZ: Asia/Jakarta
      NODE_OPTIONS: --max-old-space-size=192
    ports:
      # Host Caddy proxies dakwah-lens.id/belajar* here. Loopback only.
      - "127.0.0.1:3200:3000"
    # The VM has 1.9 GB RAM and the main web container already uses ~615 MB;
    # cap the module so it can never starve prod (plan §7.2).
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/belajar/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [dakwah]

networks:
  # Joins the main stack's network to reach `postgres` (own DB + role).
  # Created by the main compose project.
  dakwah:
    external: true
    name: dakwah-lens_dakwah

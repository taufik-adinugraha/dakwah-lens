name: Deploy belajar

# The /belajar module (Belajar Al-Qur'an) deploys on its own, decoupled from
# the main stack (docs/belajar-plan.md §7.6):
#   - path-filtered: only module changes trigger it, and deploy.yml ignores
#     the same paths (no user-facing "update in progress" overlay for them);
#   - its own concurrency group (a shared group would cancel pending runs of
#     the other workflow);
#   - the image is built HERE on the runner, never on the 1.9 GB prod VM or
#     the operator's laptop, smoke-tested against a throwaway Postgres on
#     every run (PRs too), then shipped with `docker save | docker load`;
#   - it ships a self-contained release dir to /srv/dakwah-lens/belajar/ and
#     NEVER touches the main checkout /srv/dakwah-lens/repo;
#   - on the VM it runs under /srv/dakwah-lens/.deploy.lock, the lock
#     deploy.yml, rollback.yml and the weekly base-image refresh also take.
on:
  push:
    branches: [main]
    paths:
      - "belajar/**"
      - "deploy/belajar/**"
      - ".github/workflows/deploy-belajar.yml"
  # The Ilmu Waris research docs are canonical inputs to checks in the verify
  # job (vector/dalil parity; validate_waris.py reads docs/waris-plan.md §8),
  # and deploy.yml ignores them: a docs-only PR must still run those checks.
  # PRs only — a docs-only push to main redeploys nothing.
  pull_request:
    paths:
      - "belajar/**"
      - "deploy/belajar/**"
      - ".github/workflows/deploy-belajar.yml"
      - "docs/waris-plan.md"
      - "docs/waris-research/**"
  workflow_dispatch:

concurrency:
  group: deploy-belajar-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: belajar
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: belajar/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Design-token parity with web/
        run: node scripts/check-token-parity.mjs

      - name: Lint
        run: npx eslint .

      - name: Test
        run: npm test

      # The narration guard that matters: no Qur'anic word in any spelling or
      # ending the AI narrator could voice (plan §6.1 A1; no human review,
      # L11), word places on screen, manifests equal to a fresh build. Stdlib
      # only, no network; render_narration.py is never run here.
      # Word compositions + the harakat primer (content/compose, narration
      # rule 14): every Arabic form re-derived from the lesson words' bytes
      # and its declared edits, the stages, the last frame = the word, the
      # authored file's hash. The Tanzil / QAC checks need pipeline/cache
      # (git-ignored) and run locally: `python3 pipeline/validate_compose.py`.
      - name: Compositions — validate (corpus-free)
        run: python3 pipeline/validate_compose.py --no-corpus
      - name: Compositions — validator mutation tests (corpus-free)
        run: python3 pipeline/test_validate_compose.py --no-corpus

      - name: Narration — manifests up to date
        run: python3 pipeline/build_narration.py --check
      - name: Narration — validate manifests
        run: python3 pipeline/validate_narration.py
      - name: Narration — validator mutation tests
        run: python3 pipeline/test_validate_narration.py

      # Konsep (operator 2026-10-10: "mention the arabic word like majrur in arabic letter"):
      # every grammar term's Arabic from ONE verified table, the inline markup (no term left
      # unmarked, no "ketuk"), Qur'anic words from the lesson content's bytes, the Harakat page and
      # the parts diagrams. pipeline/cache is git-ignored, so CI runs the corpus-free half; the
      # validator names what it skipped (Shamela page pins, bytes outside the lesson words), which
      # runs locally with plain `python3 pipeline/validate_terms.py`.
      - name: Konsep — terms + markup (corpus-free)
        run: python3 pipeline/validate_terms.py --no-corpus
      - name: Konsep — validator mutation tests (corpus-free)
        run: python3 pipeline/test_validate_terms.py --no-corpus

      # Ilmu Waris M1 (docs/waris-plan.md §10). Research-phase parity: the
      # belajar copies of the test vectors and of dalil.json must equal the
      # docs/waris-research originals byte for byte (this job checks out the
      # whole repo, so both pairs are checked).
      - name: Waris — vector + dalil parity (docs ↔ belajar)
        run: node scripts/check-waris-vector-parity.mjs

      # api/data and pipeline/cache are git-ignored, so CI runs the
      # corpus-free checks (parity, references, plan §8 gap list, provenance
      # record hashes, prose, RuleNotes) and prints what it skipped; the
      # corpus checks (Qur'an/hadith/kitab bytes, spans, pins) run locally
      # with plain `python3 pipeline/validate_waris.py`. Stdlib only.
      - name: Waris — dalil + RuleNote validation (corpus-free)
        run: python3 pipeline/validate_waris.py --no-corpus

      # Planted-fault tests of that validator; the faults only a corpus
      # check can catch are listed as skipped, by name.
      - name: Waris — validator mutation tests (corpus-free)
        run: python3 pipeline/test_validate_waris.py --no-corpus

      # Full type check first: `next build` stops at the FIRST type error,
      # which costs a CI round per error. `next typegen` writes the route
      # types (PageProps/LayoutProps) without building, then tsc lists every
      # error at once.
      - name: Typecheck (all errors at once)
        run: npx next typegen && npx tsc --noEmit -p .

      # `next build` is the typecheck for App Router (PageProps/LayoutProps
      # globals only exist after build) and prerenders the lesson pages.
      - name: Build
        run: npm run build

  # Build the real runtime image and smoke-test it on EVERY run (PRs too):
  # `next build` passing does not prove the container starts — e.g. a
  # package bundled away from node_modules only fails at `docker run`.
  # On main, the same image is then shipped and deployed.
  image:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: smoke
          POSTGRES_PASSWORD: smoke
          POSTGRES_DB: smoke
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U smoke"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4

      # Node for the CI scripts below (Playwright, the waris smoke/e2e scripts, tsx); the image
      # brings its own runtime.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build image
        id: build
        run: |
          set -euo pipefail
          docker build \
            --build-arg GIT_SHA="${GITHUB_SHA::7}" \
            -t dakwah-belajar-web:latest \
            belajar

      - name: Smoke-test the image (migrations, health, pages, redirects)
        run: |
          set -euo pipefail
          # A failed check must not leave :3300 taken for the steps below.
          trap 'docker rm -f smoke >/dev/null 2>&1 || true' EXIT
          docker run -d --name smoke --network host -e PORT=3300 \
            -e DATABASE_URL=postgres://smoke:smoke@127.0.0.1:5432/smoke \
            dakwah-belajar-web:latest
          ok=""
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3300/belajar/api/health; then ok=1; break; fi
            sleep 2
          done
          echo
          docker logs smoke 2>&1 | tail -20
          [[ -n "$ok" ]] || { echo "✗ container never became healthy"; exit 1; }
          health="$(curl -fsS http://127.0.0.1:3300/belajar/api/health)"
          grep -q '"database":"ok"' <<<"$health"
          # Capture first: `docker logs | grep -q` under pipefail dies with
          # SIGPIPE (exit 141) when grep -q exits on an early match.
          logs="$(docker logs smoke 2>&1)"
          grep -q "applied 0001_init.sql" <<<"$logs"
          # Hub, Qur'an track, shared library, lessons (plan L9 URL shape). This container starts
          # like production, without BELAJAR_SURAHS: only Al-Fatihah is published (operator,
          # 2026-10-10; src/lib/features.ts). The Mu'awwidzat lessons answer 200 in the "every
          # surah listed" step below; here surahs-smoke.mjs --hidden checks they are hidden.
          for path in /belajar/id /belajar/en /belajar/id/kredit /belajar/id/konsep \
                      /belajar/id/konsep/harakat /belajar/en/konsep/harakat /belajar/id/konsep/huruf-jar \
                      /belajar/id/quran /belajar/en/quran \
                      /belajar/id/quran/al-fatihah /belajar/id/quran/al-fatihah/1 \
                      /belajar/id/quran/al-fatihah/7 /belajar/en/quran/al-fatihah/5; do
            code="$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:3300${path}")"
            echo "${path} -> ${code}"; [[ "$code" == 200 ]]
          done
          # Unknown surah / ayah / path → the module's 404, not a 500.
          for path in /belajar/id/quran/al-baqarah /belajar/id/quran/al-fatihah/8 /belajar/id/quran/an-nas/7 \
                      /belajar/id/al-baqarah; do
            code="$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:3300${path}")"
            echo "${path} -> ${code}"; [[ "$code" == 404 ]]
          done
          # Pre-hub lesson URLs answer a permanent 308 to the exact new
          # location (next.config.ts redirects), with and without a locale.
          # The host is stripped so only the path is compared.
          while read -r from to; do
            got="$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' "http://127.0.0.1:3300${from}")"
            code="${got%% *}"; url="${got#* }"; path="/${url#*://*/}"
            echo "${from} -> ${code} ${path}"
            [[ "$code" == 308 && "$path" == "$to" ]]
          done <<'EOF'
          /belajar/id/al-fatihah /belajar/id/quran/al-fatihah
          /belajar/id/al-fatihah/2 /belajar/id/quran/al-fatihah/2
          /belajar/en/al-fatihah /belajar/en/quran/al-fatihah
          /belajar/en/al-fatihah/2 /belajar/en/quran/al-fatihah/2
          /belajar/al-fatihah /belajar/id/quran/al-fatihah
          /belajar/al-fatihah/2 /belajar/id/quran/al-fatihah/2
          EOF
          # The hub links to the track, the track to the surah; no rendered
          # page still links to the old lesson shape.
          hub="$(curl -fsS http://127.0.0.1:3300/belajar/id)"
          grep -q 'href="/belajar/id/quran"' <<<"$hub"
          # Konsep: the header link on every page + the hub's own card.
          [[ "$(grep -o 'href="/belajar/id/konsep"' <<<"$hub" | wc -l)" -ge 2 ]]
          track="$(curl -fsS http://127.0.0.1:3300/belajar/id/quran)"
          grep -q 'href="/belajar/id/quran/al-fatihah"' <<<"$track"
          # Ayah chips on the track page: hub → track → ayah N is two taps.
          grep -q 'href="/belajar/id/quran/al-fatihah/7"' <<<"$track"
          # The lesson page carries the streamed recitation + the AI-assisted footer.
          page="$(curl -fsS http://127.0.0.1:3300/belajar/id/quran/al-fatihah/1)"
          grep -q "Alafasy" <<<"$page"
          grep -q "Dibantu AI" <<<"$page"
          # No human review step exists (operator, 2026-10-09): nothing on the
          # page, including the next-intl messages payload, may promise one.
          if grep -qiE "tinjauan ustadz|ditinjau ustadz|awaiting ustadz|reviewed by an ustadz" <<<"$page"; then echo "✗ page promises an ustadz review"; exit 1; fi
          grep -q "bukan fatwa otoritatif" <<<"$page" || { echo "✗ AI-assisted footer missing"; exit 1; }
          # The footer is the one AI label on the Qur'an track (operator, 2026-10-10): the per-card
          # "Dibantu AI · bukan fatwa" chips and the "Masa uji coba" banner are gone, their message
          # keys too (so not even the messages payload carries them), and the spoken start line no
          # longer says "dan bukan fatwa".
          for path in /belajar/id/quran/al-fatihah /belajar/id/quran/al-fatihah/1; do
            html="$(curl -fsS "http://127.0.0.1:3300${path}")"
            if grep -qF -e "Dibantu AI · bukan fatwa" -e "Masa uji coba" -e "dan bukan fatwa" <<<"$html"; then
              echo "✗ ${path}: a removed AI chip / trial banner / spoken 'bukan fatwa' is back"; exit 1
            fi
          done
          # Al-Fatihah ayah 1 is narrated (Kang Nandar): its page ships the same-origin narration
          # files and their word timings for the karaoke caption. The MP3s themselves are uploaded
          # to the VM media dir (Caddy, /belajar/media/), not baked into the image.
          grep -q '/belajar/media/narration/kang-nandar/al-fatihah/' <<<"$page" || { echo "✗ ayah 1 page carries no narration audio"; exit 1; }
          grep -q 'href="/belajar/id/quran/al-fatihah/2"' <<<"$page"
          # The autoplay lesson: an ayah page carries the single "Mulai pelajaran" button and
          # the one-line hint that one click starts everything (server-rendered, before any
          # script runs). "Klik", never "ketuk" (operator, 2026-10-10). Every ayah of the
          # Mu'awwidzat gets the same check in the "every surah listed" step below.
          for path in /belajar/id/quran/al-fatihah/2 /belajar/id/quran/al-fatihah/7; do
            html="$(curl -fsS "http://127.0.0.1:3300${path}")"
            grep -q 'data-autoplay="start"' <<<"$html" || { echo "✗ ${path}: no autoplay start button"; exit 1; }
            grep -q '<span>Mulai pelajaran</span>' <<<"$html" || { echo "✗ ${path}: Mulai pelajaran label missing"; exit 1; }
            grep -q 'Klik sekali; pelajaran berjalan sendiri' <<<"$html" || { echo "✗ ${path}: one-click hint missing"; exit 1; }
            if grep -qiE '\b(ketuk|mengetuk|diketuk)\b' <<<"$html"; then echo "✗ ${path}: says ketuk (use klik)"; exit 1; fi
            echo "${path}: autoplay start ok"
          done
          en_page="$(curl -fsS http://127.0.0.1:3300/belajar/en/quran/al-fatihah/1)"
          grep -q 'data-autoplay="start"' <<<"$en_page" || { echo "✗ /belajar/en/quran/al-fatihah/1: no autoplay start button"; exit 1; }
          for html in "$hub" "$track" "$page" \
                      "$(curl -fsS http://127.0.0.1:3300/belajar/id/quran/al-fatihah)" \
                      "$(curl -fsS http://127.0.0.1:3300/belajar/id/konsep)"; do
            if grep -Eq 'href="/belajar/(id|en)/al-fatihah' <<<"$html"; then
              echo "✗ a rendered page still links to an old /{locale}/al-fatihah URL"; exit 1
            fi
          done
          # Konsep (operator 2026-10-10): grammar terms in Arabic script RENDERED in the HTML. The
          # <script> payload (RSC + the next-intl messages) is cut away first, so a string that
          # only travels in the payload cannot pass; the Arabic is read from content/library.json,
          # never typed here. The index lists the Harakat page first (the konsep-item shot opens it).
          strip_scripts() { perl -0pe 's/<script\b.*?<\/script>//gs'; }
          majrur_ar="$(python3 -c 'import json; print(next(t["ar"] for t in json.load(open("belajar/content/library.json"))["terms"] if t["id"] == "majrur"))')"
          for path in /belajar/id/konsep /belajar/id/konsep/huruf-jar; do
            html="$(curl -fsS "http://127.0.0.1:3300${path}" | strip_scripts)"
            grep -qF "$majrur_ar" <<<"$html" || { echo "✗ ${path}: the Arabic of majrur is not rendered"; exit 1; }
            n="$(grep -o '<bdi lang="ar"' <<<"$html" | wc -l || true)"
            [[ "$n" -ge 10 ]] || { echo "✗ ${path}: only ${n} Arabic terms rendered"; exit 1; }
            if grep -qiE '\b(ketuk|mengetuk|diketuk)\b' <<<"$html"; then echo "✗ ${path}: says ketuk (use klik)"; exit 1; fi
            echo "${path}: ${n} Arabic terms rendered"
          done
          html="$(curl -fsS http://127.0.0.1:3300/belajar/id/konsep/huruf-jar | strip_scripts)"
          grep -q 'href="/belajar/id/konsep/harakat"' <<<"$html" || { echo "✗ huruf-jar: no link to the Harakat page"; exit 1; }
          grep -q '<figure' <<<"$html" || { echo "✗ huruf-jar: no parts diagram"; exit 1; }
          html="$(curl -fsS http://127.0.0.1:3300/belajar/id/konsep/harakat | strip_scripts)"
          grep -q 'mark-circle' <<<"$html" || { echo "✗ /konsep/harakat: no sign on a dotted circle"; exit 1; }
          idx="$(curl -fsS http://127.0.0.1:3300/belajar/id/konsep | strip_scripts)"
          # sed reads to the end (head would close the pipe early: SIGPIPE 141 under pipefail)
          first="$(grep -o 'href="/belajar/id/konsep/[a-z0-9-]*"' <<<"$idx" | sed -n 1p || true)"
          [[ "$first" == 'href="/belajar/id/konsep/harakat"' ]] || { echo "✗ /konsep: the first concept link is ${first}, not the Harakat page"; exit 1; }
          loc="$(curl -s -o /dev/null -w '%{redirect_url}' http://127.0.0.1:3300/belajar)"
          echo "/belajar -> ${loc}"; [[ "$loc" == */belajar/id ]]
          # The Dakwah-Lens brand and the ways to the main site (operator, 2026-10-10: Belajar
          # should bring people to dakwah-lens.id): the header logo (a rendered <img
          # alt="Dakwah-Lens">, its next/image rendition fetched), the main site's favicon and
          # apple-touch icon under /belajar (same bytes), the footer's "Bagian dari Dakwah-Lens"
          # link to the main home (matched inside <footer>, never in the messages payload), the
          # bridges' UTM-tagged main-site addresses, og:/twitter: tags on the hub, the track and
          # every lesson (og:url = canonical, still noindex), and every share card: 200
          # image/png 1200×630 (hub, track, each lesson in id + en); unknown lessons' cards 404,
          # the hidden waris 404 carries no card. Lists every problem; fails after the restart check.
          brand_rc=0
          node belajar/scripts/ci/brand-smoke.mjs || brand_rc=$?
          # Ilmu Waris is hidden on the live site (operator, 2026-10-10; src/lib/features.ts), and
          # this container starts like production, without BELAJAR_WARIS: every waris route (track,
          # hitung, laporan; id + en; also fetched as the App Router does, percent-encoded, and
          # with the TAB/LF/CR or trailing space next-intl strips on its way to the page) answers
          # 404 with nothing of the track in the body, and the hub (id, en) has no waris
          # card and no link into the track. The track itself is tested with the switch on in the
          # "Ilmu Waris with the switch on" step below. Lists every problem, then fails the step
          # after the restart check below has run.
          waris_rc=0
          node belajar/scripts/ci/waris-smoke.mjs --hidden || waris_rc=$?
          # Al-Fatihah first (operator, 2026-10-10: the other surahs "segera hadir", not
          # clickable; src/lib/features.ts BELAJAR_SURAHS, unset here as in production):
          # /belajar/api/surahs lists Al-Fatihah only; every page of Al-Ikhlas, Al-Falaq and An-Nas
          # (id + en, every ayah; also as an RSC request, percent-encoded, TAB/LF/CR-mangled, and
          # through the pre-hub 308) answers the module's 404 with none of its ayat in the body;
          # the track page (id, en) shows each of them as a "Segera hadir" card that is no <a>
          # and links nowhere into them; the hub's "Tersedia sekarang" names Al-Fatihah only; the
          # concept and word pages show their places as plain text, never a link. Lists every
          # problem, then fails the step after the restart check below.
          surahs_rc=0
          node belajar/scripts/ci/surahs-smoke.mjs --hidden || surahs_rc=$?
          # Migrations are idempotent across restarts.
          docker restart smoke >/dev/null
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3300/belajar/api/health >/dev/null 2>&1 && break
            sleep 2
          done
          logs="$(docker logs smoke 2>&1)"
          grep -q "up to date" <<<"$logs"
          docker rm -f smoke >/dev/null
          [[ "$brand_rc" -eq 0 ]] || { echo "✗ brand / bridge / share-card checks failed (listed above)"; exit 1; }
          [[ "$waris_rc" -eq 0 ]] || { echo "✗ Ilmu Waris is not hidden (listed above)"; exit 1; }
          [[ "$surahs_rc" -eq 0 ]] || { echo "✗ the unpublished surahs are not hidden (listed above)"; exit 1; }

      # Visual review without a developer laptop: phone + desktop screenshots
      # of the real image, uploaded as a build artifact on every run. The
      # container starts like production (no BELAJAR_WARIS, no BELAJAR_SURAHS),
      # so the shots show what production shows: the hidden waris and Al-Ikhlas
      # addresses' 404, the Mu'awwidzat as "Segera hadir" cards (checked in the
      # browser: no link, nothing to focus) and the end of Al-Fatihah's lesson
      # (checked: "Al-Ikhlas segera hadir", no "Surah berikutnya", no move on).
      # The Ilmu Waris pages and the Mu'awwidzat lessons are shot in their
      # switch-on steps below. The
      # narration MP3s are not in the repo or the image (they live in the VM
      # media dir), so for the Al-Fatihah ayah 1 karaoke shots the script
      # answers the narration URLs ITSELF, in the browser only (Playwright
      # route): the git-ignored pipeline/out file when present, else a silent
      # stand-in as long as the manifest's `ms`. BELAJAR_DIR points it at the
      # manifests. Production routing is untouched. Brand and sharing (operator,
      # 2026-10-10): the header measured at every text size (logo loaded, one
      # mark + Aa + Menu, no overlap, one row on the desktop, at most two on a
      # phone) and shot at the normal and largest size; the footer's rendered
      # "Bagian dari Dakwah-Lens" link (href checked on the element); the
      # Bagikan fallback panel (WhatsApp link, Salin tautan → "Tautan
      # disalin"); the end-of-surah card with its Tafsir Pekan Ini bridge; and
      # two share cards (hub, Al-Fatihah 1) saved as served.
      - name: Screenshots (phone + desktop)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          trap 'docker rm -f shots >/dev/null 2>&1 || true' EXIT
          docker run -d --name shots --network host -e PORT=3300 \
            -e DATABASE_URL=postgres://smoke:smoke@127.0.0.1:5432/smoke \
            dakwah-belajar-web:latest
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3300/belajar/api/health >/dev/null 2>&1 && break
            sleep 2
          done
          mkdir -p /tmp/shots-run && cp belajar/scripts/ci/screenshots.mjs belajar/scripts/ci/narration-route.mjs /tmp/shots-run/
          cd /tmp/shots-run
          npm init -y >/dev/null
          npm install --no-audit --no-fund --silent playwright@1.49.1
          npx playwright install --with-deps chromium >/dev/null
          BELAJAR_DIR="$GITHUB_WORKSPACE/belajar" node screenshots.mjs
          docker rm -f shots >/dev/null

      # Line breaks (operator, 2026-10-10: "make sure the line break is clean and easy to read,
      # sometime i see wrong line break especially for arabic words"). linebreaks.mjs measures
      # where Chromium REALLY breaks the lines of the real image: every page a learner reaches by
      # its links (hub, track, each linked surah, every linked ayah closed and with every
      # disclosure open, Konsep and every concept, every Kosakata entry linked from those) and the
      # autoplay lesson step by step (Al-Fatihah 1 with the routed narration, so the karaoke
      # caption; 2 and 7 caption-only, 7 up to its end card; each kind of exercise answered once,
      # so its feedback is measured too), on a phone (390) and a desktop (1280), each at the three
      # text sizes. A self-test first lays out linebreaks-fixture.html in a real page: a bad case
      # of every kind must be caught, the markup as it ships must pass, and a unit wider than its
      # line must break in the paragraph's flow. Any offender (a term split from its Arabic, a
      # hyphenated word cut, a line starting with "," or "·", a box as wide as its line, text
      # sticking out of its column, the ayah marker alone on a row, …) fails the step; each is
      # printed, and all are in shots/linebreaks.json with lb-*.png shots at each size (uploaded
      # below). Its own container, started like production (no BELAJAR_SURAHS), so it measures
      # what production shows: the Al-Fatihah pages, the Mu'awwidzat as "Segera hadir" cards and
      # the end of Al-Fatihah saying the next surah is coming soon. The Mu'awwidzat pages are
      # measured on the every-surah container in the next step (linebreaks.mjs --surahs).
      # Removed on every exit so :3300 is free again.
      - name: Line breaks (phone + desktop, three text sizes)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          trap 'docker rm -f linebreaks >/dev/null 2>&1 || true' EXIT
          docker run -d --name linebreaks --network host -e PORT=3300 \
            -e DATABASE_URL=postgres://smoke:smoke@127.0.0.1:5432/smoke \
            dakwah-belajar-web:latest
          ok=""
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3300/belajar/api/health >/dev/null 2>&1; then ok=1; break; fi
            sleep 2
          done
          [[ -n "$ok" ]] || { docker logs linebreaks 2>&1 | tail -20; echo "✗ container never became healthy"; exit 1; }
          mkdir -p /tmp/shots-run
          cp belajar/scripts/ci/linebreaks.mjs belajar/scripts/ci/linebreaks-measure.mjs \
             belajar/scripts/ci/linebreaks-fixture.mjs belajar/scripts/ci/linebreaks-fixture.html \
             belajar/scripts/ci/narration-route.mjs /tmp/shots-run/
          cd /tmp/shots-run
          # Normally installed by the screenshots step; install here if that step did not get there.
          if [[ ! -d node_modules/playwright ]]; then
            [[ -f package.json ]] || npm init -y >/dev/null
            npm install --no-audit --no-fund --silent playwright@1.49.1
            npx playwright install --with-deps chromium >/dev/null
          fi
          BELAJAR_DIR="$GITHUB_WORKSPACE/belajar" node linebreaks.mjs

      # The Mu'awwidzat on the real image, on a container started with every surah listed
      # (BELAJAR_SURAHS): only Al-Fatihah is published on the live site (operator, 2026-10-10;
      # src/lib/features.ts), but Al-Ikhlas, Al-Falaq and An-Nas stay built and tested, so showing
      # them is an env change.
      #   smoke (surahs-smoke.mjs): /belajar/api/surahs lists all four; every surah and ayah page
      #         answers 200, each ayah with the single "Mulai pelajaran" button and the one-click
      #         hint, "klik" never "ketuk"; the pre-hub URLs 308 into them; the track page has no
      #         "Segera hadir" card and links every surah; the hub lists all four; the concept and
      #         word pages link into each of them again;
      #   screenshots (screenshots.mjs --surahs): the track, Al-Ikhlas 1, An-Nas 6, and the end of
      #         Al-Fatihah offering "Surah berikutnya: Al-Ikhlas" (checked in the browser);
      #   line breaks (linebreaks.mjs --surahs): the check of the step above on this container,
      #         where the pages a learner reaches by links include every Mu'awwidzat surah and ayah
      #         page and the concept and word pages link into them (the end of Al-Fatihah offers
      #         "Surah berikutnya: Al-Ikhlas"); its results in shots/linebreaks-semua-surah.json and
      #         lb-semua-surah-*.png.
      # Each lists its problems; the step fails after all three have run.
      - name: Al-Mu'awwidzat with every surah listed (smoke, screenshots, line breaks)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          # A failed check must not leave :3300 taken.
          trap 'docker rm -f surahs >/dev/null 2>&1 || true' EXIT
          docker run -d --name surahs --network host -e PORT=3300 \
            -e BELAJAR_SURAHS=al-fatihah,al-ikhlas,al-falaq,an-nas \
            -e DATABASE_URL=postgres://smoke:smoke@127.0.0.1:5432/smoke \
            dakwah-belajar-web:latest
          ok=""
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3300/belajar/api/health >/dev/null 2>&1; then ok=1; break; fi
            sleep 2
          done
          [[ -n "$ok" ]] || { docker logs surahs 2>&1 | tail -20; echo "✗ container never became healthy"; exit 1; }
          smoke_rc=0
          node belajar/scripts/ci/surahs-smoke.mjs || smoke_rc=$?
          mkdir -p /tmp/shots-run
          cp belajar/scripts/ci/screenshots.mjs belajar/scripts/ci/narration-route.mjs \
             belajar/scripts/ci/linebreaks.mjs belajar/scripts/ci/linebreaks-measure.mjs \
             belajar/scripts/ci/linebreaks-fixture.mjs belajar/scripts/ci/linebreaks-fixture.html /tmp/shots-run/
          cd /tmp/shots-run
          # Normally installed by the screenshots step; install here if that step did not get there.
          if [[ ! -d node_modules/playwright ]]; then
            [[ -f package.json ]] || npm init -y >/dev/null
            npm install --no-audit --no-fund --silent playwright@1.49.1
            npx playwright install --with-deps chromium >/dev/null
          fi
          shots_rc=0
          BELAJAR_DIR="$GITHUB_WORKSPACE/belajar" node screenshots.mjs --surahs || shots_rc=$?
          lb_rc=0
          BELAJAR_DIR="$GITHUB_WORKSPACE/belajar" node linebreaks.mjs --surahs || lb_rc=$?
          docker rm -f surahs >/dev/null
          rc=0
          [[ "$smoke_rc" -eq 0 ]] || { echo "✗ Mu'awwidzat smoke checks failed (listed above)"; rc=1; }
          [[ "$shots_rc" -eq 0 ]] || { echo "✗ Mu'awwidzat screenshots failed (above)"; rc=1; }
          [[ "$lb_rc" -eq 0 ]] || { echo "✗ line breaks with every surah listed failed (listed above)"; rc=1; }
          exit "$rc"

      # Ilmu Waris on the real image, on a container started with the switch on
      # (BELAJAR_WARIS=on): the track is hidden on the live site (operator, 2026-10-10;
      # src/lib/features.ts) but stays built and tested, so showing it again is an env change.
      #   smoke (docs/waris-plan.md §10 M2.7, M2.13): every waris route (track, hitung, laporan;
      #         id + en) answers 200, noindex, with the AI chip and "bukan fatwa", and no visible
      #         text promises an ustadz review (there is none); unknown waris paths 404; the hub
      #         card and the track's door link through;
      #   screenshots of the three waris pages (screenshots.mjs --waris, phone + desktop);
      # and end to end (docs/waris-plan.md §10):
      #   M2.6  a simple, an 'aul and a radd family driven through /waris/hitung screen by screen
      #         (the plan's screens must be exactly the model's); every fikih data-share equals the
      #         test vector; FAILS on any POST and on any request other than static assets under
      #         /belajar/_next/, /belajar/api/me and the module's own pages (GET, "?_rsc=" only);
      #   M2.9  case 3 printed (A4 PDF + print-media screenshot): fails above 3 pages; every vector
      #         the questionnaire can express is opened from its #j= share link, checked, and
      #         measured; the longest is recorded;
      #   M2.10 reduced motion: no animation running on any screen; screenshots;
      #   M2.5  no k6 and no rupiah in storage or the address.
      # The plan comes from the questionnaire model + content/waris/test-vectors.json (pure TS,
      # run with tsx; no npm install) and is checked against the report model before any browser.
      # The smoke and the screenshots list their problems and fail the step after the end-to-end
      # run, so one run reports all three.
      - name: Ilmu Waris with the switch on (smoke, screenshots, end-to-end)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          # A failed check must not leave :3300 taken.
          trap 'docker rm -f waris >/dev/null 2>&1 || true' EXIT
          mkdir -p /tmp/shots-run
          (cd belajar && npx --yes tsx@4.19.2 scripts/ci/waris-e2e-plan.ts --out /tmp/shots-run/waris-plan.json)
          docker run -d --name waris --network host -e PORT=3300 -e BELAJAR_WARIS=on \
            -e DATABASE_URL=postgres://smoke:smoke@127.0.0.1:5432/smoke \
            dakwah-belajar-web:latest
          ok=""
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3300/belajar/api/health >/dev/null 2>&1; then ok=1; break; fi
            sleep 2
          done
          [[ -n "$ok" ]] || { docker logs waris 2>&1 | tail -20; echo "✗ container never became healthy"; exit 1; }
          smoke_rc=0
          node belajar/scripts/ci/waris-smoke.mjs || smoke_rc=$?
          cp belajar/scripts/ci/screenshots.mjs belajar/scripts/ci/narration-route.mjs belajar/scripts/ci/waris-e2e.mjs /tmp/shots-run/
          cd /tmp/shots-run
          # Normally installed by the screenshots step; install here if that step did not get there.
          if [[ ! -d node_modules/playwright ]]; then
            [[ -f package.json ]] || npm init -y >/dev/null
            npm install --no-audit --no-fund --silent playwright@1.49.1
            npx playwright install --with-deps chromium >/dev/null
          fi
          shots_rc=0
          node screenshots.mjs --waris || shots_rc=$?
          node waris-e2e.mjs waris-plan.json
          docker rm -f waris >/dev/null
          [[ "$smoke_rc" -eq 0 ]] || { echo "✗ waris smoke checks failed (listed above)"; exit 1; }
          [[ "$shots_rc" -eq 0 ]] || { echo "✗ waris screenshots failed (above)"; exit 1; }

      - name: Upload screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: belajar-screenshots
          # shots/: page screenshots (the waris pages and the Mu'awwidzat lessons from their
          # switch-on containers), waris e2e shots + print PDFs + waris-e2e-record.json (page
          # counts, heights, network summary), linebreaks.json + lb-*.png (the line-break check:
          # every offender, shots at each text size; linebreaks-semua-surah.json +
          # lb-semua-surah-*.png from the every-surah container); waris-plan.json: the e2e plan.
          path: |
            /tmp/shots-run/shots/*.png
            /tmp/shots-run/shots/*.pdf
            /tmp/shots-run/shots/*.json
            /tmp/shots-run/waris-plan.json
          if-no-files-found: warn
          retention-days: 14

      - name: Ship release + deploy on VM
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          SSH_OPTS=(-i "$HOME/.ssh/deploy_key" -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30)
          TARGET="${DEPLOY_USER}@${DEPLOY_HOST}"
          REL="/srv/dakwah-lens/belajar/incoming-${GITHUB_SHA::7}"

          # Release dir: image + this commit's deploy script + compose file.
          # Shipped OUTSIDE the main checkout (/srv/dakwah-lens/repo), which
          # only the main deploy, rollback and the weekly refresh may move.
          ssh "${SSH_OPTS[@]}" "$TARGET" "mkdir -p '$REL'"
          docker save dakwah-belajar-web:latest | gzip -1 \
            | ssh "${SSH_OPTS[@]}" "$TARGET" "cat > '$REL/belajar-image.tar.gz'"
          scp "${SSH_OPTS[@]}" deploy/belajar/deploy.sh deploy/belajar/docker-compose.yml "$TARGET:$REL/"

          # Same VM lock as deploy.yml / rollback.yml / the weekly refresh.
          ssh "${SSH_OPTS[@]}" "$TARGET" \
            "flock -w 1800 /srv/dakwah-lens/.deploy.lock bash '$REL/deploy.sh' '$REL'"
